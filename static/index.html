<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>炉石单机版</title>
<style>
body{background:#161618;color:#ddd;font:14px/1.5 -apple-system,"PingFang SC",sans-serif;margin:0;padding:12px}
button{background:#2a2a2e;color:#ddd;border:1px solid #444;border-radius:4px;padding:5px 10px;cursor:pointer;font-size:13px}
button:hover{background:#3a3a40}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#bar{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #333}
.card{position:relative;border:1px solid #555;border-radius:5px;padding:5px 7px;background:#222226;cursor:pointer;min-width:96px;max-width:150px;font-size:12px}
.card.L{border-color:#c98820;background:#2b2418}
.card.E{border-color:#8a5fc0;background:#241f2e}
.card.R{border-color:#3f6f9e}
.rar{font-size:10px;margin-left:3px;opacity:.9}
.rar.L{color:#f0b040}
.rar.E{color:#c77dff}
.rar.R{color:#6ab0f3}
.rar.C{color:#888}
.card:hover{border-color:#8ab}
.card.sel{border-color:#fa3;background:#33291a}
.card .n{font-weight:600;font-size:12px}
.card .c{color:#9cf;font-size:11px}
.card .t{color:#999;font-size:11px;margin-top:2px;max-height:44px;overflow:hidden}
.card.dim{opacity:.45}
.hero{border:1px solid #666;border-radius:5px;padding:6px 10px;background:#1e1e22;cursor:pointer;display:inline-block;min-width:150px}
.hero.sel{border-color:#fa3}
.hero .hp{color:#f66;font-weight:600}
.hero .ar{color:#9cf}
.board{min-height:76px;border:1px dashed #3a3a40;border-radius:5px;padding:6px;margin:6px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}
.board.hot{border-color:#fa3}
.zone-label{color:#777;font-size:12px;margin-top:8px}
#log{height:120px;overflow:auto;background:#111;border:1px solid #2a2a2e;border-radius:4px;padding:6px;font-size:12px;color:#999;margin-top:8px}
.hidden{display:none}
.pill{display:inline-block;padding:1px 6px;border-radius:9px;background:#333;font-size:11px;margin-left:4px}
.tag-taunt{background:#6b5;border-radius:3px;padding:0 3px;color:#000;font-size:10px}
.tag-shield{background:#fc3;border-radius:3px;padding:0 3px;color:#000;font-size:10px}
.tag-stealth{background:#79c;border-radius:3px;padding:0 3px;color:#000;font-size:10px}
.card.dimmed{opacity:.45;cursor:not-allowed}
.card.full{opacity:.45;cursor:not-allowed}
.card .own{position:absolute;right:5px;top:4px;font-size:10px;color:#9cf;background:#1b1b1f;border:1px solid #3a3a40;border-radius:8px;padding:0 4px}
.filters{margin:6px 0 2px}
.filters input,.filters select{background:#1b1b1f;color:#ddd;border:1px solid #3a3a40;border-radius:4px;padding:4px 7px;font-size:13px}
.filters input{min-width:200px}
.st-none{color:#a66}
.st-part{color:#d9a441}
.st-legend{font-size:11px;color:#888;margin-top:6px}
.grid{display:flex;gap:10px;margin-top:10px}
.col{flex:1;min-width:260px}
.scroll{height:62vh;overflow:auto;border:1px solid #2a2a2e;border-radius:5px;padding:6px}
#chooseBox{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:20;
  background:#222226;border:1px solid #fa3;border-radius:8px;padding:10px 12px;
  box-shadow:0 6px 24px #000a;max-width:760px}
#chooseBox .ct{color:#fa3;font-size:12px;margin-bottom:8px}
#chooseBox button{margin:0 6px 6px 0}
.tag-choose{background:#3a6b5c;border-radius:3px;padding:0 3px;color:#cfe;font-size:10px}
#notice{margin-top:8px;padding:7px 10px;border-radius:5px;font-size:13px;line-height:1.5}
#notice.err{background:#3a1f22;border:1px solid #a4494f;color:#f4b0b6}
#notice.info{background:#1f2f3a;border:1px solid #3d6b8a;color:#b7d7ef}
#notice .x{float:right;cursor:pointer;color:#999;margin-left:12px}
#notice .x:hover{color:#ddd}
</style>
</head>
<body>

<div id="bar">
  <div class="row">
    <span>职业</span>
    <select id="cls"></select>
    <button onclick="randomDeck()">随机卡组</button>
    <button onclick="clearDeck()">清空</button>
    <span>卡组 <b id="cnt">0</b>/30 <span id="cntHint" class="st-legend"></span></span>
    <button id="go" onclick="startGame()" disabled>开始对战</button>
    <button onclick="backToDeck()" class="hidden" id="back">返回组卡</button>
    <button onclick="startGame()" class="hidden" id="again">再来一局</button>
    <span id="hint" style="color:#fa3"></span>
    <span id="seed" class="st-legend"></span>
  </div>
  <div id="notice" class="hidden"></div>
</div>

<!-- 组卡视图 -->
<div id="viewDeck">
  <div class="row filters">
    <input id="q" placeholder="搜索卡名或卡面文字" oninput="drawPool()">
    <select id="fcost" onchange="drawPool()">
      <option value="">全部费用</option>
      <option value="0-1">0–1 费</option>
      <option value="2-3">2–3 费</option>
      <option value="4-5">4–5 费</option>
      <option value="6+">6 费及以上</option>
    </select>
    <select id="frar" onchange="drawPool()">
      <option value="">全部稀有度</option>
      <option value="COMMON">普通</option>
      <option value="RARE">稀有</option>
      <option value="EPIC">史诗</option>
      <option value="LEGENDARY">传说</option>
    </select>
    <span id="poolCount" class="st-legend"></span>
  </div>
  <div class="grid">
    <div class="col">
      <div class="zone-label" id="poolLabel">卡池（点击加入卡组）</div>
      <div class="scroll" id="pool"></div>
    </div>
    <div class="col">
      <div class="zone-label">我的卡组（点击移除）</div>
      <div class="scroll" id="mydeck"></div>
    </div>
  </div>
</div>

<!-- 对战视图 -->
<div id="viewGame" class="hidden">
  <div class="zone-label">对手</div>
  <div class="row">
    <div class="hero" id="foeHero" onclick="pick('foe',-1)"></div>
    <span class="pill">手牌 <b id="foeHand">0</b></span>
    <span class="pill">牌库 <b id="foeDeck">0</b></span>
  </div>
  <div class="board" id="foeBoard"></div>

  <div class="board" id="meBoard"></div>
  <div class="row">
    <div class="hero" id="meHero" onclick="selHero()"></div>
    <span class="pill">法力 <b id="mana">0</b>/<b id="maxmana">0</b></span>
    <span class="pill">牌库 <b id="meDeck">0</b></span>
    <button id="hpBtn" onclick="usePower()">英雄技能 (2费)</button>
    <button onclick="endTurn()">结束回合</button>
    <span id="timer" style="color:#fa3;font-weight:600"></span>
  </div>

  <div class="zone-label">手牌（点击选中 → 点目标/点己方战场出牌）</div>
  <div class="board" id="hand"></div>
  <div id="log"></div>
</div>

<div id="chooseBox" class="hidden"></div>

<script>
let ALL=[], DECK=[], S=null, SEL=null, CN={}, HP={};

async function api(path, body){
  const opt = body ? {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)} : {};
  let r;
  try {
    r = await fetch(path, opt);
  } catch(e){
    // 网络层失败（服务没起、端口没了、代理挡了 127.0.0.1）
    throw {code:'network', message:'连不上本地服务：确认 serve.py 还在运行，或代理是否挡了 127.0.0.1'};
  }
  let data = null;
  try {
    data = await r.json();
  } catch(e){
    throw {code:'bad_response',
           message:`服务返回了无法解析的内容（HTTP ${r.status}），看终端有没有报错`};
  }
  if(!r.ok || data.ok === false){
    const err = (data && data.error) || {};
    throw {code: err.code || ('http_' + r.status),
           message: err.message || `操作失败（HTTP ${r.status}）`,
           state: data && data.state,
           hp_used: data && data.hp_used};
  }
  return data;
}

// ---- 统一的提示条：成功不弹，失败/结算才显示 ----
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function notice(msg, kind){
  const el = document.getElementById('notice');
  el.className = kind === 'info' ? 'info' : 'err';
  el.innerHTML = `<span class="x" onclick="clearNotice()">✕</span>${esc(msg)}`;
}
function clearNotice(){
  const el = document.getElementById('notice');
  el.className = 'hidden';
  el.innerHTML = '';
}

async function loadPool(){
  try{
    const d = await api('/api/cards?cls='+document.getElementById('cls').value);
    ALL = d.cards;
    const sel = document.getElementById('cls');
    d.classes.forEach(c=>{CN[c.id]=c.name});
    HP = d.hero_powers || {};
    if(sel.options.length===0){
      d.classes.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.name;sel.appendChild(o)});
      sel.value='MAGE';
    }
    drawPool();
  }catch(e){
    notice('加载卡池失败：' + e.message);
  }
}

const RAR_CN={LEGENDARY:'传说',EPIC:'史诗',RARE:'稀有',COMMON:'普通'};
const RAR_CODE={LEGENDARY:'L',EPIC:'E',RARE:'R',COMMON:'C'};
function rarTag(c){
  const code=RAR_CODE[c.rarity]||'C';
  return `<span class="rar ${code}">${RAR_CN[c.rarity]||''}</span>`;
}
function stTag(c){
  if(!c.ok) return '<span class="st-none">白板</span>';
  if(c.partial) return '<span class="st-part">部分</span>';
  return '';
}
const COST_RANGE={'':'','0-1':[0,1],'2-3':[2,3],'4-5':[4,5],'6+':[6,99]};
function ownedMax(c){ return c.rarity==='LEGENDARY' ? 1 : 2; }
function ownedCount(cid){ return DECK.filter(x=>x===cid).length; }

// 当前筛选条件下的卡池（搜索 + 费用区间 + 稀有度）
function filteredPool(){
  const q = (document.getElementById('q').value||'').trim().toLowerCase();
  const fr = document.getElementById('fcost').value;
  const rr = document.getElementById('frar').value;
  const range = COST_RANGE[fr];
  return ALL.filter(c=>{
    if(q){
      const hay = (c.name||'') + ' ' + (c.text||'');
      if(!hay.toLowerCase().includes(q)) return false;
    }
    if(range && (c.cost < range[0] || c.cost > range[1])) return false;
    if(rr && c.rarity !== rr) return false;
    return true;
  });
}

function cardHtml(c){
  const cost = `<span class="c">${c.cost}</span>`;
  const st = (c.type==='MINION') ? `<b>${c.atk}/${c.hp}</b>` : (c.type==='WEAPON'?`${c.atk}/${c.hp}`:'法术');
  const cn = (c.cls && c.cls!=='NEUTRAL') ? `<span class="pill">${CN[c.cls]||c.cls}</span>` : '';
  const code = RAR_CODE[c.rarity]||'C';
  const have = ownedCount(c.cid), max = ownedMax(c);
  const full = have>=max || DECK.length>=30;
  const badge = have ? `<span class="own">${have}/${max}</span>` : '';
  const click = full ? '' : ` onclick="add('${c.cid}')"`;
  return `<div class="card ${code} ${full?'full':''}"${click}>
    ${badge}
    <div class="n">${cost} ${c.name}${rarTag(c)}</div>
    <div>${st} ${stTag(c)}${cn}</div>
    <div class="t">${(c.text||'').replace(/</g,'&lt;')}</div></div>`;
}

function drawPool(){
  const shown = filteredPool();
  document.getElementById('pool').innerHTML = shown.map(c=>cardHtml(c)).join('') ||
    '<div class="st-legend">没有符合条件的卡牌</div>';
  const full = ALL.filter(c=>c.ok && !c.partial).length;
  const part = ALL.filter(c=>c.ok && c.partial).length;
  const blank = ALL.filter(c=>!c.ok).length;
  document.getElementById('poolLabel').innerHTML =
    `卡池 ${ALL.length} 张 — 完整效果 <b style="color:#8f8">${full}</b> · ` +
    `部分效果 <b class="st-part">${part}</b> · 白板 <b class="st-none">${blank}</b>`;
  document.getElementById('poolCount').textContent =
    shown.length === ALL.length ? '' : `筛出 ${shown.length} 张`;

  const cnt={}; DECK.forEach(c=>cnt[c]=(cnt[c]||0)+1);
  document.getElementById('mydeck').innerHTML = Object.keys(cnt).map(cid=>{
    const c = ALL.find(x=>x.cid===cid) || {cid,name:cid,cost:'?',text:'',type:''};
    return `<div class="card" onclick="remove('${cid}')">
      <div class="n">${cnt[cid]}x ${c.name}</div><div class="c">${c.cost} 费</div></div>`;
  }).join('') || '<div class="st-legend">还没有卡牌，点左边卡池加入</div>';

  const left = 30 - DECK.length;
  document.getElementById('cnt').textContent = DECK.length;
  document.getElementById('cntHint').textContent =
    left > 0 ? `（还差 ${left} 张）` : '（已满，可以开战）';
  document.getElementById('go').disabled = DECK.length!==30;
}

function add(cid){
  const card = ALL.find(x=>x.cid===cid);
  const max = card ? ownedMax(card) : 2;
  const same = ownedCount(cid);
  const hint = document.getElementById('hint');
  if(same>=max){
    hint.textContent = `「${card?.name||cid}」最多带 ${max} 张`;
    return;
  }
  if(DECK.length>=30){
    hint.textContent = '卡组已满 30 张，先移除一张再添加';
    return;
  }
  hint.textContent = '';
  DECK.push(cid); drawPool();
}
function remove(cid){ const i=DECK.lastIndexOf(cid); if(i>=0){DECK.splice(i,1);
  document.getElementById('hint').textContent=''; drawPool();} }
function clearDeck(){ DECK=[]; document.getElementById('hint').textContent=''; drawPool(); }
async function randomDeck(){
  try{
    const d = await api('/api/random_deck',{cls:document.getElementById('cls').value});
    DECK=d.deck; drawPool(); clearNotice();
  }catch(e){ notice('生成随机卡组失败：' + e.message); }
}

async function startGame(){
  clearNotice();
  try{
    const r = await api('/api/start',{deck:DECK, cls:document.getElementById('cls').value});
    document.getElementById('viewDeck').classList.add('hidden');
    document.getElementById('viewGame').classList.remove('hidden');
    document.getElementById('back').classList.remove('hidden');
    document.getElementById('go').disabled=true;
    document.getElementById('seed').textContent = r.seed ? `本局种子 ${r.seed}` : '';
    document.getElementById('again').classList.add('hidden');
    SEL=null; render(r.state, r.hp_used);
  }catch(e){
    notice('开局失败：' + e.message);
  }
}
function backToDeck(){
  clearNotice();
  document.getElementById('again').classList.add('hidden');
  document.getElementById('viewGame').classList.add('hidden');
  document.getElementById('viewDeck').classList.remove('hidden');
  document.getElementById('back').classList.add('hidden');
  document.getElementById('go').disabled = DECK.length!==30;
}

function mHtml(m, side, i){
  const tags = (m.taunt?'<span class="tag-taunt">嘲讽</span>':'') + (m.shield?'<span class="tag-shield">圣盾</span>':'') + (m.frozen?'❄':'');
  const atk = m.attackable ? '<span style="color:#8f8">●</span>' : '<span style="color:#666">○</span>';
  // 正在选目标时，敌方的潜行随从不能被指定：置灰、不给点击
  const blocking = SEL && side==='foe' && m.stealth;
  const cls = blocking ? 'card dimmed' : 'card';
  const click = blocking ? '' : `onclick="pick('${side}',${i})"`;
  return `<div class="${cls} ${RAR_CODE[m.rarity]||'C'}" ${click}>
    <div class="n">${atk} ${m.name} ${tags}${m.stealth?'<span class="tag-stealth">潜行</span>':''}</div>
    <div><b>${m.atk}/${m.hp}</b></div>
    <div class="t">${(m.text||'').replace(/</g,'&lt;')}</div></div>`;
}

function render(s, hpUsed){
  S=s;
  const me=s.me, foe=s.foe;
  const heroLine = (p, mine) => {
    const wp = p.weapon ? `<span class="ar">武器 ${p.weapon.name} ${p.weapon.atk}/${p.weapon.durability}</span>` : '';
    const atk = p.hero_atk>0
      ? (mine ? (p.hero_can_attack?'<span style="color:#8f8">●</span>':'<span style="color:#666">○</span>') : '') + ` <b style="color:#fd6">⚔${p.hero_atk}</b>`
      : '';
    const sec = p.secrets>0 ? `<span class="ar" title="场上奥秘数量">🔒${p.secrets}</span>` : '';
    const ovl = p.locked_mana>0 ? `<span class="ar" title="本回合被过载锁住的水晶">过载${p.locked_mana}</span>` : '';
    const hn = (p.hero_name && p.hero_name!==p.name) ? `<span class="pill">${p.hero_name}</span>` : '';
    const fz = p.frozen ? '<span class="ar" title="被冻结：本回合不能攻击">❄冻结</span>' : '';
    return `${p.name} <span class="hp">${p.hp}</span> ${p.armor?'<span class="ar">'+p.armor+'甲</span>':''}${atk} ${wp}${sec}${ovl}${hn}${fz}`;
  };
  document.getElementById('foeHero').innerHTML = heroLine(foe, false);
  document.getElementById('meHero').innerHTML = heroLine({...me, name:`我（${CN[me.cls]||''}）`}, true);
  document.getElementById('foeHand').textContent = foe.hand.length;
  document.getElementById('foeDeck').textContent = foe.deck;
  document.getElementById('meDeck').textContent = me.deck;
  document.getElementById('mana').textContent = me.mana;
  document.getElementById('maxmana').textContent = me.max_mana;
  const hpBtn = document.getElementById('hpBtn');
  hpBtn.disabled = hpUsed || me.mana<2 || s.over;
  hpBtn.title = HP[me.cls] || '';
  document.getElementById('foeBoard').innerHTML = foe.board.map((m,i)=>mHtml(m,'foe',i)).join('');
  document.getElementById('meBoard').innerHTML = me.board.map((m,i)=>mHtml(m,'me',i)).join('');
  document.getElementById('hand').innerHTML = me.hand.map((c,i)=>
    `<div class="card ${RAR_CODE[c.rarity]||'C'} ${c.playable===false?'dim':''} ${SEL&&SEL.kind==='hand'&&SEL.i===i?'sel':''}" onclick="selHand(${i})">
      <div class="n"><span class="c">${c.cost}</span> ${c.name}${rarTag(c)}${(c.choose&&c.choose.length)?'<span class="tag-choose">抉择</span>':''}</div>
      <div>${c.type==='MINION'?`<b>${c.atk}/${c.hp}</b>`:(c.type==='WEAPON'?`${c.atk}/${c.hp}`:'法术')}</div>
      <div class="t">${(c.text||'').replace(/</g,'&lt;')}</div></div>`).join('');
  document.getElementById('log').innerHTML = (s.log||[]).slice().reverse().map(l=>l).join('<br>');
  document.getElementById('hint').textContent = s.over ? (s.winner==='你'?'★ 你赢了':'你输了') : (SEL? '选择目标…' : '');
  // 诺兹多姆：双方回合限时
  if(s.timer>0 && s.cur===0 && !s.over) startTimer(s.timer); else stopTimer();
}

let TMR=null, TLEFT=0;
function stopTimer(){
  if(TMR){ clearInterval(TMR); TMR=null; }
  const el=document.getElementById('timer'); if(el) el.textContent='';
}
function startTimer(sec){
  if(TMR) return;                       // 已经在倒数，别重开
  TLEFT=sec;
  const el=document.getElementById('timer');
  if(el) el.textContent=`⏳ ${TLEFT}s`;
  TMR=setInterval(()=>{
    TLEFT--;
    if(el) el.textContent=`⏳ ${TLEFT}s`;
    if(TLEFT<=0){ stopTimer(); endTurn(); }   // 时间到自动结束回合
  },1000);
}

function selHand(i){
  const c = S.me.hand[i];
  SEL = {kind:'hand', i}; render(S, document.getElementById('hpBtn').disabled);
  if(c.choose && c.choose.length){          // 抉择牌：先选效果
    openChoose(i, c.choose);
    document.getElementById('hint').textContent = '抉择：先选一个效果';
    return;
  }
  document.getElementById('hint').textContent = '点击目标，或点己方战场区出牌';
}

function openChoose(i, opts){
  const box = document.getElementById('chooseBox');
  box.innerHTML = '<div class="ct">抉择 —— 选一个效果</div>' +
    opts.map((o,k)=>`<button onclick="pickChoice(${i},${k})">${o.label}</button>`).join('') +
    '<button onclick="closeChoose()">取消</button>';
  box.classList.remove('hidden');
}
function closeChoose(){
  document.getElementById('chooseBox').classList.add('hidden');
  SEL=null;
  document.getElementById('hint').textContent='';
}

async function pickChoice(i, k){
  document.getElementById('chooseBox').classList.add('hidden');
  const opt = S.me.hand[i].choose[k];
  if(opt.tgt){                              // 这个选项要指定目标 → 进选目标流程
    SEL = {kind:'hand', i, choice:k};
    render(S, document.getElementById('hpBtn').disabled);
    document.getElementById('hint').textContent = `已选「${opt.label}」→ 点击目标`;
    return;
  }
  await act('/api/play',{idx:i, choice:k, target:null});
}

async function pick(side, i){
  if(!SEL){
    if(side==='me' && i>=0){
      const m = S.me.board[i];
      if(!m.attackable){                       // 说清楚为什么点不动
        document.getElementById('hint').textContent = m.frozen
          ? `${m.name} 被冻结，本回合不能攻击`
          : `${m.name} 本回合不能攻击（刚上场或已经攻击过）`;
        return;
      }
      SEL={kind:'board', i};
      render(S,document.getElementById('hpBtn').disabled);
      document.getElementById('hint').textContent='点击敌方随从或英雄攻击';
    }
    return;
  }
  const t = {side, i};
  if(SEL.kind==='hand'){
    await act('/api/play',{idx:SEL.i, target:t, choice:SEL.choice});
  } else if(SEL.kind==='board'){
    await act('/api/attack',{src:SEL.i, target:t});
  } else if(SEL.kind==='power'){
    await act('/api/heropower',{target:t});
  } else if(SEL.kind==='hero'){
    await act('/api/heroattack',{target:t});
  }
}

// 点己方战场空白处 = 打出无目标牌
document.getElementById('meBoard').addEventListener('click', async e=>{
  if(e.target.id!=='meBoard') return;
  if(SEL && SEL.kind==='hand'){
    await act('/api/play',{idx:SEL.i, target:null, choice:SEL.choice});
  }
});

function usePower(){
  SEL={kind:'power'};
  document.getElementById('hint').textContent='点击目标（或点自己英雄）';
}

// 点自己英雄 = 出牌时当作目标（治疗/增益），否则选中英雄去攻击
function selHero(){
  const me = S && S.me;
  if(!me) return;
  if(SEL && SEL.kind==='hand'){ pick('me',-1); return; }
  if(me.hero_atk>0 && me.hero_can_attack){
    SEL={kind:'hero'}; render(S, document.getElementById('hpBtn').disabled);
    document.getElementById('hint').textContent='点击敌方随从或英雄进行攻击';
  }else{
    document.getElementById('hint').textContent = me.hero_atk>0 ? '本回合已攻击过' : '没有攻击力（需装备武器或德鲁伊变脸）';
  }
}

async function endTurn(){
  if(S && S.over) return;                       // 结算后不再往服务端发无效请求
  await act('/api/end', {});
}

// 动作统一入口：成功 → after()；失败 → failed()（保留局面与选择状态）
async function act(path, body){
  try{
    const r = await api(path, body);
    after(r);
    return true;
  }catch(e){
    failed(e);
    return false;
  }
}

function after(r){
  clearNotice();
  SEL=null;
  document.getElementById('chooseBox').classList.add('hidden');
  if(r.state) render(r.state, r.hp_used);
  if(r.state && r.state.over){
    document.getElementById('again').classList.remove('hidden');   // 结算后直接重开
    notice(r.state.winner==='你'
      ? '对局结束：你赢了。点「再来一局」用同一套卡组重开，或点「返回组卡」改卡组。'
      : '对局结束：你输了。点「再来一局」用同一套卡组重开，或点「返回组卡」改卡组。', 'info');
  } else {
    document.getElementById('again').classList.add('hidden');
  }
}

// 失败：局面原样保留（服务端会带回 state），只有「局面不在」时才放弃选择状态
function failed(e){
  if(e.state) render(e.state, e.hp_used);
  if(!e.state && (e.code==='network' || e.code==='bad_response' || e.code==='no_game')){
    SEL=null;
    document.getElementById('chooseBox').classList.add('hidden');
  }
  if(e.code==='no_game'){                 // 服务端丢了对局（重启/刷新）→ 退回组卡
    S=null;
    document.getElementById('viewGame').classList.add('hidden');
    document.getElementById('viewDeck').classList.remove('hidden');
    document.getElementById('back').classList.add('hidden');
  }
  notice(e.message || '操作失败');
}

document.getElementById('cls').addEventListener('change', ()=>{ DECK=[]; loadPool(); });
loadPool();
</script>
